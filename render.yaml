    const deviceCount = devRow ? devRow.count : 0;
    db.get('SELECT COUNT(*) as count FROM events', (err, evtRow) => {
      const eventCount = evtRow ? evtRow.count : 0;

      res.send(`
        <!DOCTYPE html>
